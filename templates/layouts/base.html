<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- css -->
		<link href="/css/style.css" rel="stylesheet" />
		<!-- Bootstrap theme -->
		<link rel="stylesheet" href="/bootswatch/minty/bootstrap.min.css" />
		<!-- Bootstrap icons -->
		<link rel="stylesheet" href="/bootstrap-icons/bootstrap-icons.min.css" />
		<!-- htmx -->
		<script src="/htmx/htmx.min.js"></script>
		<!-- Bootstrap js -->
		<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
		<!-- js -->
		<script src="/js/modals.js"></script>
		<script src="/js/popovers.js"></script>
		<script src="/js/select-all.js"></script>
		<script src="/js/toasts.js"></script>
		<script src="/js/tooltips.js"></script>
		<title>{{ .Title }}</title>
	</head>
	<body class="bg-light">
		<!-- Firefox flashing layout voodoo hack -->
		<script>0;</script>
		<!-- Modals -->
		{{ template "confirmModal" }}
		<div class="modal fade" id="modal" tabindex="-1">
			<div class="modal-dialog modal-dialog-centered">
				{{ template "addTaskPlaceholderModal" }}
				{{ template	"editTaskPlaceholderModal" }}
				{{ template "cloneTaskPlaceholderModal" }}
			</div>
		</div>
		<!-- Toasts -->
		<div class="toast-container position-fixed top-0 end-0 p-3"></div>
		<!-- Page -->
		{{ template "page" . }}
	</body>
	<script>
		initModals();
		initToasts();
		initTooltips();
	</script>
</html>
