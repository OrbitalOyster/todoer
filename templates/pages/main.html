{{ define "page" }}
	<main class="col-xl-7 col-md-100 m-auto">
	    {{ template "navbar" . }}
		<div class="card shadow-sm">
			<div class="card-header text-center">
				<strong>Tasks</strong>
			</div>
			<div class="card-body">
				{{ template "task-filters" . }}
				<hr />
				<div id="task-list">{{ template "task-list" . }}</div>
				<script>
					createSelectAllGroup("#select-all-tasks", ".select-task");
				</script>
			</div>
		</div>
	</main>
{{ end }}
