{{ define "page" }}
	<main class="col-xl-7 col-md-100 m-auto">
		{{ template "navbar" . }}
		<div class="card shadow-sm">
			<div class="card-header text-center">
				<strong>
					Users
				</strong>
			</div>
			<div class="card-body">
				<ul>
					{{ range .Users }}
						<li><a href="/users/{{ .Id }}">{{ .Name }}</a> - {{ .Role }}</li>
					{{ end }}
				</ul>
			</div>
		</div>
	</main>
{{ end }}
