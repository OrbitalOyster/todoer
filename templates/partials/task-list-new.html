{{ define "task-list-new" }}
	<!-- More than zero tasks found -->
	{{ if gt (len .Tasks) 0 }}
		<form id="task-list-form">
			<table class="table table-striped">
				<thead>
					<tr>
						<th class="text-center align-middle select-all position-relative">
							<!-- Select all tasks -->
							<input
								class="form-check-input htmx-disable"
								type="checkbox"
								id="select-all-tasks"
								autocomplete="off"
							/>
							<button
								class="btn btn-link position-absolute htmx-disable"
								style="top: .3rem"
								data-bs-toggle="dropdown"
							>
								<i class="bi bi-three-dots-vertical fs-5"></i>
							</button>
							{{ template "task-multiple-actions" }}
						</th>
						<th class="text-center align-middle task-id">
							#
						</th>
						<th class="text-center align-middle">
							<!-- Sort by description -->
							<button
								class="btn btn-link dotted htmx-disable"
								type="button"
								hx-get="/hx/tasks-new"
								hx-target="#task-list"
								hx-indicator="#task-list"
								hx-disabled-elt=".htmx-disable"
								hx-vals='{
									"sortBy": "Description",
									{{ if eq .SortBy "Description" }}
										"sortDesc": {{ if eq .SortDesc true }} false {{ else }} true {{ end }}
									{{ else }}
										"sortDesc": false
									{{ end }}
								}'
							>
								<b>
									What
								</b>
								{{ if eq .SortBy "Description" }}
									{{ if eq .SortDesc true }}
										<i class="bi bi-sort-down"></i>
									{{ else }}
										<i class="bi bi-sort-down-alt"></i>
									{{ end }}
								{{ end }}
							</button>
						</th>
						<th class="text-center align-middle datetime">
							<!-- Sort by date -->
							<button
								class="btn btn-link dotted htmx-disable"
								hx-get="/hx/tasks-new"
								hx-target="#task-list"
								hx-indicator="#task-list"
								hx-disabled-elt=".htmx-disable"
								hx-vals='{
									"sortBy": "Datetime",
									{{ if eq .SortBy "Datetime" }}
										"sortDesc": {{ if eq .SortDesc true }} false {{ else }} true {{ end }}
									{{ else }}
										"sortDesc": false
									{{ end }}
								}'
							>
								<b>
									When
								</b>
								{{ if eq .SortBy "Datetime" }}
									{{ if eq .SortDesc true }}
										<i class="bi bi-sort-down"></i>
									{{ else }}
										<i class="bi bi-sort-down-alt"></i>
									{{ end }}
								{{ end }}
							</button>
						</th>
						<th class="text-center align-middle">
							Who
						</th>
						<th class="text-center align-middle status">
							Status
						</th>
						<th class="text-center align-middle actions">
							Actions
						</th>
					</tr>
				</thead>
				<tbody class="table-group-divider" id="task-table-body">
					{{ range $index, $task := .Tasks }}
						<tr id="task-{{ $task.Id }}">
							<!-- Select task checkbox -->
							<td class="text-center align-middle">
								<input
									class="form-check-input select-task htmx-disable"
									type="checkbox"
									name="checked"
									value="{{ $task.Id }}"
									autocomplete="off"
									{{ if index $.Checkboxes $index }}
										checked
									{{ end }}
								/>
							</td>
							{{ template "task" $task }}
						</tr>
					{{ end }}
				</tbody>
			</table>
			<script>
				createSelectAllGroup("form.htmx-added #select-all-tasks", "form.htmx-added .select-task")
			</script>
		</form>
		<!-- Pagination -->
		{{ template "pagination-new" . }}
	{{ else }}
	 	<!-- Nothing found -->
		{{ template "task-empty" . }}
	{{ end }}
{{ end }}
