{{ define "pagination-new" }}
	<div class="d-flex justify-content-between align-items-center">
		<!-- Previous page -->
		{{ if gt .TotalPages 1 }}
			<button
				class="btn btn-primary htmx-disable"
				type="button"
				id="previous-page"
				data-bs-toggle="tooltip"
				data-bs-placement="left"
				data-bs-trigger="hover"
				title="Previous page"
				{{ if ne .Page 1 }}
					name="page"
					value="{{ minusOne .Page }}"
					hx-get="/hx/tasks-new"
					hx-target="#task-list"
					hx-indicator="#task-list"
					hx-disabled-elt=".htmx-disable"
				{{ else }}
					disabled
				{{ end }}
			>
				<i class="bi bi-chevron-left"></i>
			</button>
		{{ end }}
		<!-- Pages -->
		<ul class="pagination m-auto">
			{{ range .Pagination }}
				{{ if eq . 0 }}
					<i class="bi bi-three-dots fs-4 text-secondary"></i>
				{{ else }}
					<li class="page-item">
						<button
							class="page-link {{ if eq $.Page . }} active {{ end }} htmx-disable"
							type="button"
							name="page"
							id="page-{{ . }}"
							value="{{ . }}"
							{{ if ne $.Page . }}
								hx-get="/hx/tasks-new"
								hx-target="#task-list"
								hx-indicator="#task-list"
								hx-disabled-elt=".htmx-disable"
							{{ end }}
						>
							{{ . }}
						</button>
					</li>
				{{ end }}
			{{ end }}
		</ul>
		<!-- Next page -->
		{{ if gt .TotalPages 1 }}
			<button
				class="btn btn-primary htmx-disable"
				type="button"
				id="next-page"
				data-bs-toggle="tooltip"
				data-bs-placement="right"
				data-bs-trigger="hover"
				title="Next page"
				{{ if ne .Page .TotalPages }}
					name="page"
					value="{{ plusOne .Page }}"
					hx-get="/hx/tasks-new"
					hx-target="#task-list"
					hx-indicator="#task-list"
					hx-disabled-elt=".htmx-disable"
				{{ else }}
					disabled
				{{ end }}
			>
				<i class="bi bi-chevron-right"></i>
			</button>
		{{ end }}
	</div>
{{ end }}
